name: Métricas dos episódios

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  metricas:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python metricas.py
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
      - name: Salvar
        if: always()
        run: |
          git config user.name "robo-esfv"; git config user.email "robo@users.noreply.github.com"
          git add -f dados && git commit -qm "métricas" && git pull -q --rebase && git push -q || echo nada
