name: Robô E Se Fosse Você

on:
  schedule:
    - cron: "0 15 * * *"   # 12h de Brasília: conta votos e posta
    - cron: "0 22 * * *"   # 19h de Brasília: conta votos e posta
    - cron: "20 * * * *"   # toda hora: só conta votos
  push:
    branches: [main]
    paths: [comando.txt]   # editar este arquivo roda a ação escrita na 1ª linha
  workflow_dispatch:
    inputs:
      acao:
        description: "O que fazer: descobrir, postar, votos ou ciclo"
        required: true
        default: "descobrir"
        type: choice
        options: [descobrir, postar, votos, ciclo]

permissions:
  contents: write

concurrency:
  group: robo
  cancel-in-progress: false

jobs:
  rodar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Escolher ação
        id: escolha
        env:
          EVENTO: ${{ github.event_name }}
          AGENDA: ${{ github.event.schedule }}
          MANUAL: ${{ inputs.acao }}
        run: |
          if [ "$EVENTO" = "workflow_dispatch" ]; then acao="$MANUAL"
          elif [ "$EVENTO" = "push" ]; then acao="$(head -n 1 comando.txt | tr -cd 'a-z')"
          elif [ "$AGENDA" = "20 * * * *" ]; then acao="votos"
          else acao="ciclo"; fi
          echo "acao=$acao" >> "$GITHUB_OUTPUT"

      - name: Rodar robô
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ACAO: ${{ steps.escolha.outputs.acao }}
          FORCAR_POST: ${{ github.event_name == 'workflow_dispatch' && inputs.acao == 'postar' && '1' || '' }}
        run: python bot.py "$ACAO"

      - name: Repostar no Facebook
        if: steps.escolha.outputs.acao == 'postar' || steps.escolha.outputs.acao == 'ciclo'
        continue-on-error: true
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          FB_TOKEN: ${{ secrets.FB_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_JANELA_H: "6"
        run: python facebook.py postar

      - name: Salvar estado no repositório
        if: always()
        run: |
          git config user.name "robo-esefossevoce"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add estado.json status.md fila/fila.json
          git add -f dados/facebook_enviados.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "robô: atualiza estado"
            for i in 1 2 3 4 5; do
              git pull --rebase && git push && break
              echo "push falhou, tentando de novo"; sleep 10
            done
          fi
