name: YouTube Shorts (Biel)

on:
  schedule:
    - cron: "37 */3 * * *"   # a cada 3h: sobe no YouTube o que já saiu no Instagram
  workflow_dispatch:
    inputs:
      acao:
        description: "enviar = sobe o que falta | autorizar = conecta o canal | metricas"
        required: true
        default: "enviar"
        type: choice
        options: [enviar, autorizar, metricas, capas]
      codigo:
        description: "Código da página yt-biel.html (só para autorizar)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: youtube-biel
  cancel-in-progress: false

jobs:
  youtube:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
      YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Rodar
        env:
          ACAO: ${{ github.event.inputs.acao || 'enviar' }}
          CODIGO: ${{ github.event.inputs.codigo }}
        run: |
          mkdir -p dados
          if [ "$ACAO" = "autorizar" ] || [ -n "$CODIGO" ]; then
            echo "::add-mask::$CODIGO"
            python youtube.py autorizar "$CODIGO" 2>&1 | tee dados/youtube.log
          elif [ -f dados/youtube_token.enc ]; then
            python youtube.py "$ACAO" 2>&1 | tee dados/youtube.log
          else
            echo "Canal ainda não conectado."
          fi
      - name: Salvar
        if: always()
        run: |
          git config user.name "robo-esfv"; git config user.email "robo@users.noreply.github.com"
          git add -f dados && git commit -qm "YouTube: registros" && git pull -q --rebase && git push -q || echo nada
