name: Arte (Cloudflare grátis)

on:
  workflow_dispatch:
    inputs:
      refazer:
        description: "ids para refazer (vazio = gera o que falta)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: arte
  cancel-in-progress: false

jobs:
  gerar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q pillow
      - run: python arte_cf.py ${{ inputs.refazer }}
        continue-on-error: true
      - name: Salvar
        if: always()
        run: |
          git config user.name "robo-esfv"; git config user.email "robo@users.noreply.github.com"
          git add -f arte && git commit -qm "arte: imagens geradas" && git pull -q --rebase && git push -q || echo nada
