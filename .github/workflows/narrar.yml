name: Narração (voz do Google)

on:
  workflow_dispatch:
    inputs:
      ep:
        description: "id do episódio (ex.: p1)"
        required: true
        default: "p1"

permissions:
  contents: write

jobs:
  narrar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q numpy scipy && (which ffmpeg || (sudo apt-get update -q && sudo apt-get install -y -q ffmpeg))
      - run: python narrar.py ${{ inputs.ep }} --so-audio 2>&1 | tee episodios/narrar_log.txt
      - name: Salvar
        if: always()
        run: |
          git config user.name "robo-esfv"; git config user.email "robo@users.noreply.github.com"
          git add -f episodios && git commit -qm "narração ${{ inputs.ep }}" && git pull -q --rebase && git push -q || echo nada
