name: Página de vendas (Vercel)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["pagina/**"]

concurrency:
  group: vercel
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Preparar pasta
        run: |
          mkdir -p /tmp/animador-de-bolso
          cp -r pagina/index.html pagina/img /tmp/animador-de-bolso/
          [ -f pagina/vsl.mp4 ] && cp pagina/vsl.mp4 /tmp/animador-de-bolso/ || true
      - name: Publicar na Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then echo "Falta o segredo VERCEL_TOKEN"; exit 1; fi
          cd /tmp/animador-de-bolso
          npx --yes vercel@39.1.1 deploy --prod --yes --token "$VERCEL_TOKEN" 2>&1 | grep -v "$VERCEL_TOKEN" | tee /tmp/saida.txt
          grep -o 'https://[a-z0-9.-]*vercel.app' /tmp/saida.txt | tail -1 > /tmp/url.txt || true
          echo "URL: $(cat /tmp/url.txt)" >> "$GITHUB_STEP_SUMMARY"
