name: Gestor de anúncios Meta

on:
  schedule:
    - cron: "7 12 * * *"   # 09:07 BRT — relatório + regras de corte
    - cron: "7 0 * * *"    # 21:07 BRT
  workflow_dispatch:
    inputs:
      acao:
        description: "checar | criarpixel | montar | ativar | pausar | relatorio | situacao | funil"
        required: false
        default: "checar"
      campanha:
        description: "arquivo da campanha"
        required: false
        default: "anuncios/animador1.json"

permissions:
  contents: write

jobs:
  anuncios:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Rodar
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          META_ADS_TOKEN: ${{ (inputs.acao == 'montar' && secrets.META_ADS_TOKEN_MONTAR) || secrets.META_ADS_TOKEN }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          ACAO: ${{ github.event_name == 'schedule' && 'relatorio' || inputs.acao }}
          CAMPANHA: ${{ inputs.campanha || 'anuncios/animador1.json' }}
        run: |
          set -o pipefail
          mkdir -p dados
          if [ "$ACAO" = "relatorio" ] && ! grep -q ativado_em dados/meta_campanha_*.json 2>/dev/null; then echo "Nenhuma campanha ligada ainda."; exit 0; fi
          python scripts/anuncios_meta.py "$ACAO" "$CAMPANHA" 2>&1 | tee dados/meta_anuncios_log.txt
      - name: Salvar
        if: always()
        run: |
          git config user.name "robo-esfv"; git config user.email "robo@users.noreply.github.com"
          git add dados/meta_* && git commit -qm "Anúncios Meta: ${ACAO:-registro}" || { echo "nada novo"; exit 0; }
          for i in 1 2 3 4 5 6; do git pull -q --rebase -X theirs origin main && git push -q origin HEAD:main && exit 0; sleep $((i*5)); done
          echo "não consegui salvar o registro"; exit 1
        env:
          ACAO: ${{ github.event_name == 'schedule' && 'relatorio' || inputs.acao }}
