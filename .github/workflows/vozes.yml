name: Vozes dos personagens (voz do Google)

on:
  workflow_dispatch:
    inputs:
      ep:
        description: "id do episódio (ex.: p2)"
        required: true
        default: "p2"

permissions:
  contents: write

jobs:
  vozes:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: which ffmpeg || (sudo apt-get update -q && sudo apt-get install -y -q ffmpeg)
      - run: python vozes.py ${{ inputs.ep }} 2>&1 | tee episodios/vozes_log.txt
      - name: Salvar
        if: always()
        run: |
          git config user.name "robo-esfv"; git config user.email "robo@users.noreply.github.com"
          git add -f episodios && git commit -qm "vozes ${{ inputs.ep }}" && git pull -q --rebase && git push -q || echo nada
